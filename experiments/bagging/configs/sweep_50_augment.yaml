program: src/training/train_augmentation_sweep.py
method: bayes
metric:
  name: best_val_accuracy
  goal: maximize

parameters:
  model_name:
    value: 'resnet50'
  
  # RandAugment
  num_ops:
    distribution: int_uniform
    min: 1
    max: 4
  magnitude:
    distribution: int_uniform
    min: 5
    max: 15
  use_cutout:
    values: [true, false]
  
  # Training parameters
  batch_size:
    values: [48, 64, 96]
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  weight_decay:
    distribution: uniform
    min: 0.01
    max: 0.1
  label_smoothing:
    distribution: uniform
    min: 0.05
    max: 0.2
  epochs:
    value: 30

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 25