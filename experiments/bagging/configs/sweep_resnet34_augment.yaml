#program: experiments/bagging/training/train_augmentation_sweep.py
method: bayes
metric:
  name: best_val_accuracy
  goal: maximize

parameters:
  model_name:
    value: 'resnet34'
  
  # AutoAugment/TrivialAugment - Geometric robustness
  policy:
    values: ['IMAGENET', 'CIFAR10', 'SVHN']
  use_trivial_augment:
    values: [true, false]
  
  # Training parameters - from ResNet34 previous sweep
  batch_size:
    values: [64, 128]
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.001 # Reduced, as the best was 0.0003
  weight_decay:
    distribution: log_uniform_values
    value: 0.0001
  label_smoothing:
    distribution: uniform
    min: 0.1
    max: 0.3
  epochs:
    value: 25

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 25 # same like epochs