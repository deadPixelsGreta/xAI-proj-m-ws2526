# Default configuration for ImageNetSubset training

training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  num_workers: 0

model:
  architecture: densenet121 
  pretrained: true

data:
  data_dir: datasets
  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1

paths:
  checkpoint_dir: experiments/checkpoints

wandb:
  enabled: true
  project: imagenet-subset-sedge
  run_name: null        # optional
  entity: null          # optional
  tags: []              # optional list of strings
  notes: null           # optional
  mode: online          # online | offline | disabled
  dir: ./wandb          # optional output dir
  group: null           # optional grouping label
  job_type: null        # optional job type
