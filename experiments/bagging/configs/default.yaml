# Default configuration for ImageNetSubset training

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  num_workers: 2 # optimized for google colab, 2 for google, 1 for M1 mac
  early_stopping_thresh: 8
  top_n_checkpoints: 2
  freeze_backbone: false

model:
  architecture: resnet50 
  pretrained: true

data:
  data_dir: C:\Users\ba079778\Downloads\ImageNetSubset\ImageNetSubset
  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1

paths:
  checkpoint_dir: experiments/checkpoints

wandb:
  enabled: true
  project: resnet
  run_name: null        # optional
  entity: null          # optional
  tags: []              # optional list of strings
  notes: null           # optional
  mode: online          # online | offline | disabled
  dir: ./wandb          # optional output dir
  group: null           # optional grouping label
  job_type: null        # optional job type
