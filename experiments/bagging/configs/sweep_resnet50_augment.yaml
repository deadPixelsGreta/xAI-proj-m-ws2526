# program: experiments/bagging/training/train_augmentation_sweep.py
method: bayes
metric:
  name: best_val_accuracy
  goal: maximize

parameters:
  model_name:
    value: 'resnet50'
  
  # Advanced augmentations - Mixup/Cutout for feature-level robustness
  num_ops:
    distribution: int_uniform
    min: 2
    max: 4
  magnitude:
    distribution: int_uniform
    min: 7
    max: 15
  use_cutout:
    values: [true, false]
  cutout_size:
    distribution: int_uniform
    min: 16
    max: 64
  use_mixup:
    values: [true, false]
  mixup_alpha:
    distribution: uniform
    min: 0.1
    max: 0.4
  
  
 # Training parameters - adjust based on your ResNet50 sweep results
  batch_size:
    values: [32, 256] # best values from previous sweep
  learning_rate:
    distribution: log_uniform_values
    min: 0.0008 # 3x smaller than best value from previous sweep 0.0023
    max: 0.004 # 1.7x larger than best value from previous sweep
  weight_decay:
    distribution: log_uniform_values
    value: 0.0001
  label_smoothing:
    distribution: uniform
    min: 0.1 # slightly bigger than best value from previous sweep 0.05 for generalization
    max: 0.3 # slightly larger than best value from previous sweep 0.08 for konzistency
  epochs:
    value: 25

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 25