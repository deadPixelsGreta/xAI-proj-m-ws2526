program: python
command:
  - ${env}
  - ${interpreter}
  - -m
  - experiments.bagging.scripts.train
  - ${args}
method: bayes
metric:
  name: best_val_accuracy
  goal: maximize

parameters:
  model:
    value: 'resnet50'

  data_dir:
    value: C:\Users\ba079778\Downloads\ImageNetSubset\ImageNetSubset
  
  # Advanced augmentations - Mixup/Cutout for feature-level robustness
  num_ops:
    distribution: int_uniform
    min: 2
    max: 5
  magnitude:
    distribution: int_uniform
    min: 9
    max: 18
  use_cutout:
    values: [true, false]
  cutout_size:
    distribution: int_uniform
    min: 16
    max: 64
  use_mixup:
    values: [true, false]
  mixup_alpha:
    distribution: uniform
    min: 0.1
    max: 0.4

  use_cutmix:
    values: [true, false]
  cutmix_alpha:
    distribution: uniform
    min: 0.5
    max: 1.5
  
  
 # Training parameters - adjust based on your ResNet50 sweep results
  batch_size:
    values: [32, 64] # best values from previous lr-batch sweep
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.0005
  weight_decay:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.0002

  optimizer:
    values: ['sgd', 'adamw']
  
  label_smoothing:
    distribution: uniform
    min: 0.05
    max: 0.25

  epochs:
    value: 30

 # WandB Logging
  wandb:
    value: true
  wandb_project:
    value: 'resnet-aug'
  num_workers:
    value: 8

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 30