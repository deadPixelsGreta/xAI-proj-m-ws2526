# WandB Sweep: DenseNet121 + Geometric Policy + Bayes LR Optimization
# Initialize: wandb sweep --project xAI-proj-m-ws2526_SP experiments/base_ensemble/configs/sweep_densenet121_geometric.yaml
# Run agent: wandb agent <SWEEP_ID>

program: experiments/base_ensemble/scripts/train_single_model.py
command:
  - ${env}
  - python
  - -m
  - experiments.base_ensemble.scripts.train_single_model
  - ${args}
method: bayes
metric:
  name: best_val_accuracy
  goal: maximize

parameters:
  config:
    value: experiments/base_ensemble/configs/default.yaml
  data_dir:
    value: datasets
  epochs:
    value: 30
  batch_size:
    value: 32
  seed:
    value: 42
  scheduler:
    value: cosine
  
  # Fixed: DenseNet121 + Geometric
  model:
    value: densenet121
  aug-policy:
    value: geometric
  
  # Bayes optimization: Learning rate
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1

early_terminate:
  type: hyperband
  min_iter: 3
  max_iter: 20
