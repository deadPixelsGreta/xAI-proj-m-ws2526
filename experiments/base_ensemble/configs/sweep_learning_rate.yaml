# WandB Sweep: Fixed Augmentation Policies + Bayes LR Optimization
# This sweep fixes model+policy pairs and optimizes learning rate using Bayesian optimization
# 
# Initialize one of these 4 sweeps:
#   wandb sweep --project xAI-proj-m-ws2526_SP experiments/base_ensemble/configs/sweep_learning_rate.yaml --set model=resnet34,aug_policy=color
#   wandb sweep --project xAI-proj-m-ws2526_SP experiments/base_ensemble/configs/sweep_learning_rate.yaml --set model=efficientnet_b0,aug_policy=blur
#   wandb sweep --project xAI-proj-m-ws2526_SP experiments/base_ensemble/configs/sweep_learning_rate.yaml --set model=densenet121,aug_policy=geometric
#   wandb sweep --project xAI-proj-m-ws2526_SP experiments/base_ensemble/configs/sweep_learning_rate.yaml --set model=vit_b_16,aug_policy=geometric

program: experiments/base_ensemble/scripts/train_single_model.py
method: bayes
metric:
  name: best_val_accuracy
  goal: maximize

parameters:
  # Fixed training parameters (from default config)
  config:
    value: experiments/base_ensemble/configs/default.yaml
  data_dir:
    value: datasets
  epochs:
    value: 30
  batch_size:
    value: 32
  seed:
    value: 42
  wandb:
    value: true
  no_sota:
    value: false
  scheduler:
    value: cosine
  label_smoothing:
    value: 0.1
  
  # Fixed model + policy pairs (assign via --set flag when initializing)
  # Example: wandb sweep ... --set model=resnet34,aug_policy=color
  model:
    value: resnet34
  
  aug_policy:
    value: color
  
  # Learning rate: Bayes optimization over log-uniform range
  # Range: 1e-5 (0.00001) to 1e-1 (0.1)
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1

# Early stopping to focus on promising regions
early_terminate:
  type: hyperband
  min_iter: 3
  max_iter: 20

