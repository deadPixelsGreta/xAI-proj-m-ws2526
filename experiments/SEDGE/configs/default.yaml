training:
  lr: 0.001
  batch_size: 32
  epochs: 30
  num_workers: 2 
  weight_decay: 1e-4
  entropy_reg_weight: 0.01
  use_group_dro: false # Disabled - data loader doesn't yield group IDs
  group_step_size: 0.01
  early_stopping_patience: 5 # Stop after N epochs without improvement (0 = disabled)

model:
  # Frozen pretrained backbones to use
  backbones:
    - resnet34
    - densenet121
    - efficientnet_b0
    - vit_b_16
  # Path to fine-tuned checkpoints (null = use ImageNet pretrained)
  backbone_checkpoint_dir: null # e.g., "experiments/base_ensemble/checkpoints"
  router_hidden_dims: [64, 32]
  num_classes: 10
  top_k: 2 # Top-k experts during inference

data:
  corruptions:
    - jpeg
    - blur
    - noise
    - jitter
    - perspective
