training:
  lr: 0.001
  batch_size: 32
  epochs: 10
  num_workers: 0 # Optimized for M1 Mac
  weight_decay: 1e-4
  entropy_reg_weight: 0.01
  use_group_dro: false # Disabled - data loader doesn't yield group IDs
  group_step_size: 0.01

model:
  # Frozen pretrained backbones to use
  backbones:
    - resnet34
    - densenet121
    - efficientnet_b0
    - vit_b_16
  router_hidden_dims: [64, 32]
  num_classes: 10
  top_k: 2 # Top-k experts during inference

data:
  corruptions:
    - jpeg
    - blur
    - noise
    - jitter
    - perspective
