program: experiments/SEDGE/scripts/train.py
method: bayes
metric:
  name: val_acc
  goal: maximize

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  
  batch_size:
    values: [128, 256, 512]
  
  epochs:
    value: 20
  
  # Router architecture
  router_hidden_dim_1:
    values: [32, 64, 128]
  
  router_hidden_dim_2:
    values: [16, 32, 64]
  
  top_k:
    values: [0, 1, 2]  # 0 = use all backbones, 1 = hard selection
  
  # Regularization
  weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  
  entropy_reg_weight:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1

  # Model training strategy
  adapter_tuning:
    value: True

command:
  - python
  - ${program}
  - --config
  - experiments/SEDGE/configs/university_pc.yaml