training:
  lr: 0.001
  batch_size: 256     # 16GB VRAM on A4000 allows for larger batches with frozen backbones
  epochs: 10
  num_workers: 8      # Efficient data fetching for multi-core CPUs
  pin_memory: true    # Optimized for CUDA transfers
  weight_decay: 1e-4
  entropy_reg_weight: 0.01
  use_group_dro: true
  group_step_size: 0.01

model:
  router_hidden_dims: [64, 32]
  num_classes: 10

data:
  data_dir: C:\Users\ba081274\Downloads\ImageNetSubset\ImageNetSubset # Path relative to project root, common for server/workstation setups
  corruptions:
    - jpeg
    - blur
    - noise
    - jitter
    - perspective
