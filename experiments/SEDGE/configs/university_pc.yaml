training:
  lr: 0.001
  batch_size: 128     # Higher batch size for dedicated GPUs
  epochs: 10
  num_workers: 8      # Use multiple CPU cores for data loading
  pin_memory: true    # Recommended for faster CPU to GPU (CUDA) transfer
  weight_decay: 1e-4
  entropy_reg_weight: 0.01
  use_group_dro: true
  group_step_size: 0.01

model:
  router_hidden_dims: [64, 32]
  num_classes: 10

data:
  data_dir: "/Users/stephpark/Documents/xai-proj-m-ws2526/ImageNetSubset" # Adjust if data is in a different location on university PC
  corruptions:
    - jpeg
    - blur
    - noise
    - jitter
    - perspective
