training:
  lr: 0.005          # Lower learning rate for stable partial fine-tuning
  batch_size: 512     # Optimized for A4000 16GB VRAM
  epochs: 30          # Increased to allow backbones to converge
  num_workers: 8      
  pin_memory: true    
  weight_decay: 1e-3  # Stronger regularization for OOD generalization
  entropy_reg_weight: 0.05
  use_group_dro: true
  group_step_size: 0.01
  adapter_tuning: true # Enables training the last blocks of each backbone

model:
  router_hidden_dims: [128, 64]
  num_classes: 10

data:
  data_dir: "datasets" # Using relative path for portability
  corruptions:
    - jpeg
    - blur
    - noise
    - jitter
    - perspective
