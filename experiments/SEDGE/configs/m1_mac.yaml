training:
  lr: 0.001
  batch_size: 32
  epochs: 1
  num_workers: 0      # Optimized for M1 Mac (avoids multiprocessing overhead)
  pin_memory: false   # Usually better to set to false for MPS
  weight_decay: 1e-4
  entropy_reg_weight: 0.01
  use_group_dro: true
  group_step_size: 0.01

model:
  router_hidden_dims: [64, 32]
  num_classes: 10

data:
  data_dir: "/Users/stephpark/Documents/xai-proj-m-ws2526/ImageNetSubset"
  corruptions:
    - jpeg
    - blur
    - noise
    - jitter
    - perspective
