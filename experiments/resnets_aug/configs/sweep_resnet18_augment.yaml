program: python
command:
  - ${env}
  - ${interpreter}
  - -m
  - experiments.resnets_aug.scripts.train
  - ${args}
method: bayes
metric:
  name: best_val_accuracy
  goal: maximize

parameters:
  model_name:
    value: 'resnet18'
  
  # ColorJitter augmentation, Resistance to color shifts
  brightness:
    distribution: uniform
    min: 0.2
    max: 0.8
  contrast:
    distribution: uniform
    min: 0.2
    max: 0.8
  saturation:
    distribution: uniform
    min: 0.2
    max: 0.8
  hue:
    distribution: uniform
    min: 0.0
    max: 0.3
  rotation:
    distribution: int_uniform
    min: 0
    max: 45
  
  # Training parameters
  batch_size:
    values: [32, 64] # Top 2 values from previous sweep
  learning_rate:
    distribution: log_uniform_values
    min: 0.0003 # # ~3x smaller than best value from previous sweep
    max: 0.0015 # # ~1.5x larger than best value from previous sweep
  weight_decay:
    distribution: log_uniform_values
    value: 0.0001
  label_smoothing:
    distribution: uniform
    min: 0.1
    max: 0.3
  epochs:
    value: 25 # slightly more than from the previous sweep

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 25 # same like epochs