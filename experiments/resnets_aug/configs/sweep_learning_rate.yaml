# WandB Sweep Configuration for Learning Rate Tuning
# This file defines a hyperparameter sweep for optimizing learning rate

program: python
command:
  - ${env}
  - ${interpreter}
  - -m
  - experiments.resnets_aug.scripts.train
  - ${args}
method: bayes  # Options: grid, random, bayes (Bayesian optimization is most efficient)
metric:
  name: best_val_accuracy  # Metric to optimize
  goal: maximize  # Maximize validation accuracy

parameters:
  # Fixed parameters from config
  config:
    value: experiments/resnets_aug/configs/default.yaml
  model:
    #value: resnet18
    #value: resnet34
    value: resnet50
  # augmentation:
  #   values:
  #     - baseline
  #     - trivial
  #     - randaugment
  #     - autoaugment
  #     - augmix
  
  # Hyperparameters to sweep
  lr:
    distribution: log_uniform_values
    min: 0.00001  # 1e-5
    max: 0.1      # 1e-1
    
  # Fixed batch size
  batch_size:
    values: [32, 64, 128, 256]

  seed:
    value: 0

# Early stopping to save compute
early_terminate:
  type: hyperband
  min_iter: 3
  max_iter: 10
